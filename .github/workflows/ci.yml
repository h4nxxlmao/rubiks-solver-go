name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the wasm
        run: node build.mjs

      - name: Run the self-test
        run: node examples/node-selfcheck.mjs 10

      - name: Upload the wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: solver-wasm
          path: dist/
